<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f1f1">
<title>Stark Future Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f1f1;--card:#fff;--ink:#0d0d0d;--mute:#9a9a9a;--g:#12f287;--gl:#edfdf5;--disc:#e6e6e6;--ring:#f7f7f7;--band:#a9a9a9;--mute2:#b5b5b5;--sub:#777;--line:#d3d3d3;--tk1:#9c9c9c;--tk2:#c4c4c4;--div:#eee;--mb:clamp(44px,11vw,56px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Unbounded','Arial Black','Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;transition:background .25s}
.dash{width:100%;height:100%;padding:12px;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--card);border-radius:22px;display:grid;grid-template-columns:1fr 1fr 1fr;height:clamp(120px,34vw,176px);position:relative;z-index:2}
.top>div{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid var(--div)}
.top>div:first-child{border-left:0}
.pill{cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.35em;height:clamp(34px,10vw,52px);width:76%;border-radius:999px;border:2px solid var(--g);color:var(--g);font-weight:800;font-size:clamp(22px,7vw,40px);background:var(--gl)}
.pill.fill{background:var(--g);color:#0d0d0d;border-color:var(--g);cursor:pointer;gap:.2em}
.pill.fill svg{width:.42em;height:.3em;flex:none}
.spd{font-size:clamp(52px,17vw,92px);font-weight:800;line-height:1;letter-spacing:-.02em}
.unit{font-size:clamp(11px,3vw,15px);color:var(--mute);font-weight:500;margin-top:.45em}
.gw{flex:1;min-height:0;overflow:hidden;margin:8px -12px -12px;position:relative;z-index:1}.gauge{display:block;width:100%;height:100%;overflow:visible}
.gauge text{font-family:inherit}
.menu{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:clamp(44px,11vw,56px);height:clamp(44px,11vw,56px);border-radius:50%;background:var(--ink);border:0;display:grid;place-items:center;cursor:pointer;z-index:3}
.dash{position:relative}
.menu span{display:block;width:44%;height:2px;background:var(--bg);box-shadow:0 -5px var(--bg),0 5px var(--bg)}
.menu.on{outline:3px solid var(--g)}
:root[data-theme="inv"]{--bg:#0d0d0d;--card:#1b1b1b;--ink:#f4f4f4;--mute:#7a7a7a;--mute2:#5c5c5c;--sub:#8a8a8a;--line:#333;--disc:#161616;--ring:#111;--band:#4a4a4a;--tk1:#777;--tk2:#444;--g:#ff2d3f;--gl:#2b0d12;--div:#2a2a2a}
#panel{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:18px;padding:6px;display:none;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:6;min-width:200px}
#panel.open{display:flex}
#panel button{font:600 13px 'Unbounded','Segoe UI',sans-serif;color:var(--ink);background:none;border:0;text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer}
#panel button:active{background:var(--gl)}
#gbox,#clk{display:none;position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:16px;z-index:4;color:var(--ink)}
body.hud #gbox{display:block}body.hud #clk{display:flex}
#gbox{left:12px;width:clamp(120px,30vw,190px);height:clamp(52px,14vw,72px);padding:6px 8px}
#gv{position:absolute;left:12px;top:7px;font:700 10px 'Unbounded','Segoe UI',sans-serif;color:var(--mute)}
#clk{right:calc(24px + var(--mb));height:var(--mb);align-items:center;padding:0 18px;font:700 clamp(16px,5vw,24px) 'Unbounded','Arial Black',sans-serif}
@media (orientation:landscape){:root{--mb:13vh}.top{height:46vh}.spd{font-size:25vh}.pill{height:12vh;font-size:9vh}.unit{font-size:3.4vh}.menu{width:13vh;height:13vh}}

</style>
</head>
<body>
<main class="dash">
  <section class="top">
    <div><div class="pill" id="gear">N</div></div>
    <div><div class="spd" id="spd">0</div><div class="unit">km/h</div></div>
    <div><div class="pill fill" id="bat"><svg viewBox="0 0 10 7"><rect x="0" y="0" width="8" height="7" rx="1.2" fill="#0d0d0d"/><rect x="8.4" y="2" width="1.6" height="3" fill="#0d0d0d"/></svg><span id="batv">23</span></div></div>
  </section>

  <div class="gw"><svg class="gauge" viewBox="0 0 1000 340" preserveAspectRatio="xMidYMin meet" aria-label="Speed gauge">
    <circle cx="500" cy="450" r="452" fill="var(--ring)"/>
    <circle cx="500" cy="450" r="372" fill="var(--disc)"/>
    <g id="ticks"></g>
    <path id="bandL" fill="none" stroke="var(--band)" stroke-width="13"/>
    <path id="bandR" fill="none" stroke="var(--band)" stroke-width="13"/>
    <path id="act" fill="none" stroke="var(--g)" stroke-width="13"/>
    <circle cx="500" cy="22" r="4" fill="var(--tk2)"/>
    <text x="272" y="262" font-size="15" fill="var(--sub)" font-weight="700" transform="rotate(-52 272 262)" text-anchor="middle">REG</text>
    <text x="728" y="262" font-size="15" fill="var(--sub)" font-weight="700" transform="rotate(52 728 262)" text-anchor="middle">MAX</text>
    <line x1="395" y1="258" x2="605" y2="258" stroke="#d6d6d6" stroke-width="1.5" transform="translate(0,-8)" opacity="0"/>
    <text x="500" y="143" text-anchor="middle" font-size="40" font-weight="700" fill="var(--ink)"><tspan font-size="13" fill="var(--mute2)" dx="0">ODO </tspan><tspan id="odo" dx="12">0</tspan><tspan font-size="13" fill="var(--mute2)" dx="10">km</tspan></text>
    <text x="500" y="222" text-anchor="middle" font-size="76" font-weight="700" fill="var(--ink)"><tspan id="th">0</tspan><tspan font-size="34" fill="var(--mute)" dx="6">h</tspan><tspan id="tm" dx="14">00</tspan><tspan font-size="34" fill="var(--mute)" dx="6">m</tspan></text>
    <line x1="270" y1="258" x2="730" y2="258" stroke="var(--line)" stroke-width="1.5"/>
    <text x="500" y="300" text-anchor="middle" font-size="19" font-weight="700" fill="var(--sub)" letter-spacing="3">STARK FUTURE</text>
  </svg></div>
  <div id="panel"><button id="mInv">Invert colors</button><button id="mHud">Show G-force and time</button><button id="mFs">Fullscreen</button><button id="mReset">Reset odometer and trip</button></div>
  <div id="gbox"><svg viewBox="0 0 120 40" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><line x1="0" y1="39.5" x2="120" y2="39.5" stroke="var(--line)"/><polyline id="gl" fill="none" stroke="var(--g)" stroke-width="1.8" vector-effect="non-scaling-stroke" points=""/></svg><div id="gv">0.00 g</div></div>
  <div id="clk">00:00</div>
  <button class="menu" id="menu" aria-label="Menu"><span></span></button>
  <div id="toast" role="status" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#0d0d0d;color:#fff;font-size:12px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;font-family:'Segoe UI',Arial,sans-serif;z-index:5"></div>
</main>

<script>
(function(){
var CX=500,CY=450,SPAN=62,MAXV=200,NS='http://www.w3.org/2000/svg';
function P(r,a){var t=a*Math.PI/180;return[CX+r*Math.sin(t),CY-r*Math.cos(t)]}
function arc(r,a0,a1){var s=P(r,a0),e=P(r,a1);return'M'+s[0]+' '+s[1]+'A'+r+' '+r+' 0 0 1 '+e[0]+' '+e[1]}
var tk=document.getElementById('ticks');
for(var i=-62;i<=62;i+=1){var big=i%10===0,mid=i%5===0;var a=P(big?428:mid?434:438,i),b=P(446,i);
 var l=document.createElementNS(NS,'line');l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);
 l.setAttribute('stroke',big?'var(--tk1)':'var(--tk2)');l.setAttribute('stroke-width',big?2.2:1.4);tk.appendChild(l)}
var R=400;
document.getElementById('bandL').setAttribute('d',arc(R,-SPAN,-.6));
document.getElementById('bandR').setAttribute('d',arc(R,.6,SPAN));
var act=document.getElementById('act');
var $=function(i){return document.getElementById(i)};
var mode=1,gearS='',spd=0,odo=0,tripMin=0,bat=23,demo=false,lastT=Date.now(),gps=null;
try{var o=parseFloat(localStorage.getItem('sf_odo2'));if(o>0)odo=o;var b=parseInt(localStorage.getItem('sf_bat'));if(b>=0&&b<=100)bat=b}catch(e){}
function render(){
 var v=Math.round(spd);$('spd').textContent=v;
 var gs=v>0?'m'+mode:'N';if(gs!==gearS){gearS=gs;if(v>0)$('gear').innerHTML='<svg viewBox="0 0 24 24" style="width:.62em;height:.62em;flex:none"><path d="M13.5 1.5 4 13.5h6.2L9 22.5l10-12.5h-6.4z" fill="#2f7bff"/></svg><span>'+mode+'</span>';else{$('gear').textContent='N';mode=1}}
 $('batv').textContent=bat;
 $('odo').textContent=Math.floor(odo);
 var m=Math.floor(tripMin);$('th').textContent=Math.floor(m/60);$('tm').textContent=('0'+(m%60)).slice(-2);
 var f=Math.min(spd/MAXV,1);
 act.setAttribute('d',f>0.004?arc(R,.6,.6+(SPAN-.6)*f):'');
}
function tick(){
 var now=Date.now(),dt=(now-lastT)/1000;lastT=now;
 if(demo){var t=now/1000;spd=Math.max(0,Math.min(MAXV,100+90*Math.sin(t/4)-(t%1)*0))}
 if(spd>1){odo+=spd*dt/3600;tripMin+=dt/60}
 render()}
setInterval(tick,250);
setInterval(function(){try{localStorage.setItem('sf_odo2',odo);localStorage.setItem('sf_bat',bat)}catch(e){}},5000);
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(function(){t.style.opacity=0},4000)}
var lastPos=null;
function hav(a,b,c,d){var r=6371000,k=Math.PI/180,x=(c-a)*k,y=(d-b)*k;var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*k)*Math.cos(c*k)*Math.sin(y/2)*Math.sin(y/2);return 2*r*Math.asin(Math.sqrt(h))}
function onPos(p){
 if(demo)return;var c=p.coords,s=c.speed;
 if((s==null||isNaN(s))&&lastPos){var dt=(p.timestamp-lastPos.t)/1000;if(dt>0.5)s=hav(lastPos.la,lastPos.lo,c.latitude,c.longitude)/dt}
 lastPos={t:p.timestamp,la:c.latitude,lo:c.longitude};
 var k=(s==null||isNaN(s))?0:Math.max(0,s*3.6);if(k<2)k=0;spd=k}
function startGps(){
 if(!navigator.geolocation){toast('GPS is not available in this browser');return}
 navigator.geolocation.watchPosition(onPos,function(e){
  toast(e.code===1?'Location is blocked. Allow location for this page and reload.':'Waiting for GPS signal…')},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000})}
startGps();
document.addEventListener('click',function once(){document.removeEventListener('click',once);if(!lastPos)startGps()});
/* phone battery */
var hasBat=false;
if(navigator.getBattery){navigator.getBattery().then(function(b){hasBat=true;
 var u=function(){bat=Math.round(b.level*100);render()};u();b.addEventListener('levelchange',u)}).catch(function(){})}
$('gear').addEventListener('click',function(){if(spd>0){mode=mode>=5?1:mode+1;gearS='';render()}});
$('bat').addEventListener('click',function(){if(!hasBat){toast('Battery reading is not supported on this browser');}});
/* menu */
var de=document.documentElement,panel=$('panel');
function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
function setInv(on){if(on)de.setAttribute('data-theme','inv');else de.removeAttribute('data-theme');
 var m=document.querySelector('meta[name=theme-color]');if(m)m.content=on?'#0d0d0d':'#f1f1f1';
 try{localStorage.setItem('sf_inv',on?'1':'0')}catch(e){}}
try{if(localStorage.getItem('sf_inv')==='1')setInv(true)}catch(e){}
$('menu').addEventListener('click',function(e){e.stopPropagation();panel.classList.toggle('open');this.classList.toggle('on',panel.classList.contains('open'))});
document.addEventListener('click',function(e){if(!panel.contains(e.target)&&e.target!==$('menu')){panel.classList.remove('open');$('menu').classList.remove('on')}});
$('mInv').addEventListener('click',function(){setInv(!de.hasAttribute('data-theme'));panel.classList.remove('open');$('menu').classList.remove('on')});
$('mReset').addEventListener('click',function(){odo=0;tripMin=0;render();try{localStorage.setItem('sf_odo2',0)}catch(e){}panel.classList.remove('open');$('menu').classList.remove('on');toast('Odometer and trip reset')});
$('mFs').addEventListener('click',function(){
 var rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
 panel.classList.remove('open');$('menu').classList.remove('on');
 if(!rq){toast('On iPhone: Share, then Add to Home Screen for fullscreen');return}
 if(isFs()){ex.call(document)}else{var r=rq.call(de);if(r&&r.catch)r.catch(function(){toast('Open the link directly in your browser to use fullscreen')});
  try{screen.orientation.lock('landscape').catch(function(){})}catch(e){}}});
function fsChg(){$('mFs').textContent=isFs()?'Exit fullscreen':'Fullscreen'}
document.addEventListener('fullscreenchange',fsChg);document.addEventListener('webkitfullscreenchange',fsChg);
/* demo mode: long-press the speed */
var pt;$('spd').addEventListener('pointerdown',function(){pt=setTimeout(function(){demo=!demo;if(!demo)spd=0;toast(demo?'Demo mode on':'Demo mode off')},900)});
['pointerup','pointerleave','pointercancel'].forEach(function(n){$('spd').addEventListener(n,function(){clearTimeout(pt)})});
/* g-force + clock */
var gNow=0,gArr=[],gSens=false;
function gm(e){var a=e.acceleration,g;if(a&&a.x!=null){g=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)/9.81}else{var b=e.accelerationIncludingGravity;if(!b||b.x==null)return;g=Math.abs(Math.sqrt(b.x*b.x+b.y*b.y+b.z*b.z)/9.81-1)}gSens=true;gNow=gNow*.7+g*.3}
function startG(){var D=window.DeviceMotionEvent;if(!D){toast('Motion sensor not available');return}
 if(D.requestPermission){D.requestPermission().then(function(r){if(r==='granted')window.addEventListener('devicemotion',gm);else toast('Allow motion access to see G-forces')}).catch(function(){})}else window.addEventListener('devicemotion',gm)}
setInterval(function(){if(!document.body.classList.contains('hud'))return;gArr.push(gNow);if(gArr.length>100)gArr.shift();
 $('gl').setAttribute('points',gArr.map(function(v,i){return(i*1.2)+','+(38-Math.min(v,1)*34)}).join(' '));$('gv').textContent=gNow.toFixed(2)+' g'},100);
function clock(){var d=new Date();$('clk').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
clock();setInterval(clock,5000);
function setHud(on){document.body.classList.toggle('hud',on);$('mHud').textContent=on?'Hide G-force and time':'Show G-force and time';try{localStorage.setItem('sf_hud',on?'1':'0')}catch(e){}}
$('mHud').addEventListener('click',function(){var on=!document.body.classList.contains('hud');setHud(on);if(on&&!gSens)startG();panel.classList.remove('open');$('menu').classList.remove('on')});
try{if(localStorage.getItem('sf_hud')==='1'){setHud(true);if(window.DeviceMotionEvent&&!DeviceMotionEvent.requestPermission)startG()}}catch(e){}
if(navigator.wakeLock){navigator.wakeLock.request('screen').catch(function(){})}
render();
})();
</script>
</body>
</html>
